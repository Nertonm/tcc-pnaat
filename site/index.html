<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNAAT - Visualização de Capturas</title>
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden antialiased transition-theme bg-light-bg dark:bg-dark-bg text-brand-black dark:text-brand-white selection:bg-brand-red selection:text-white">

    <!-- App Container (Floating effect on large screens) -->
    <div class="flex w-full h-full p-0 sm:p-4 gap-4">
        
        <!-- Sidebar -->
        <aside class="w-20 lg:w-64 flex flex-col transition-theme bg-light-card dark:bg-dark-card rounded-none sm:rounded-3xl shadow-soft border border-light-border dark:border-dark-border z-20 overflow-hidden flex-shrink-0">
            
            <!-- Logo Area -->
            <div class="h-20 flex items-center justify-center lg:justify-start lg:px-8 border-b border-light-border dark:border-dark-border">
                <div class="w-10 h-10 rounded-xl bg-brand-red/10 flex items-center justify-center text-brand-red">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-xl tracking-tight ml-3 hidden lg:block gradient-text">PNAAT</span>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-2" id="sidebar-nav">
                <button onclick="app.navigate('operacao')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Operação</span>
                </button>
                <button onclick="app.navigate('capturas')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="image" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Capturas</span>
                </button>
                <button onclick="app.navigate('investigacao')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="search" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Investigação</span>
                </button>
                <button onclick="app.navigate('qualidade')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="pie-chart" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Qualidade</span>
                </button>
                <button onclick="app.navigate('saude')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="cpu" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Saúde da Pi</span>
                </button>
                <button onclick="app.navigate('lote')" class="nav-item group w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-brand-black dark:hover:text-brand-white hover:bg-light-bg dark:hover:bg-dark-bg transition-all">
                    <i data-lucide="layers" class="w-5 h-5 lg:mr-3 transition-transform group-hover:scale-110"></i> 
                    <span class="hidden lg:block">Relatório de Lote</span>
                </button>
            </nav>

            <!-- Footer da Sidebar (Theme toggle & User) -->
            <div class="p-4 border-t border-light-border dark:border-dark-border">
                <button onclick="app.toggleTheme()" class="w-full flex items-center justify-center lg:justify-start px-3 py-3 rounded-2xl text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-light-bg dark:hover:bg-dark-bg transition-colors">
                    <div class="relative w-5 h-5 lg:mr-3">
                        <i data-lucide="moon" class="w-5 h-5 absolute inset-0 hidden dark:block transition-transform duration-500 rotate-0 dark:rotate-360"></i>
                        <i data-lucide="sun" class="w-5 h-5 absolute inset-0 block dark:hidden transition-transform duration-500 rotate-180 dark:rotate-0"></i>
                    </div>
                    <span class="hidden lg:block dark:hidden">Modo Escuro</span>
                    <span class="hidden lg:block hidden dark:block">Modo Claro</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-light-card dark:bg-dark-card rounded-none sm:rounded-3xl shadow-soft border border-light-border dark:border-dark-border">
            
            <!-- Header (Glassmorphism) -->
            <header class="h-20 flex items-center justify-between px-6 sm:px-10 border-b transition-theme border-light-border dark:border-dark-border glass-card sticky top-0 z-10">
                <div>
                    <h1 id="page-title" class="text-2xl font-bold tracking-tight">Operação</h1>
                    <p id="page-subtitle" class="text-sm text-gray-500 dark:text-gray-400 mt-1">Visão geral da bancada em tempo real</p>
                </div>
                
                <div class="flex items-center space-x-3 sm:space-x-6">
                    <div class="hidden sm:flex flex-col items-end">
                        <div class="flex items-center text-sm font-medium">
                            <span class="relative flex h-3 w-3 mr-2">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-brand-green"></span>
                            </span>
                            SISTEMA ONLINE
                        </div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Latência: 12ms</span>
                    </div>
                    
                    <div class="h-10 w-px bg-light-border dark:bg-dark-border hidden sm:block"></div>
                    
                    <div class="flex items-center space-x-3 bg-light-bg dark:bg-dark-bg px-4 py-2 rounded-2xl border border-light-border dark:border-dark-border">
                        <i data-lucide="package" class="w-4 h-4 text-gray-500"></i>
                        <span class="text-sm font-medium">Lote: <span class="text-brand-red ml-1">#L2024-89</span></span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6 sm:p-10 relative">
                <!-- Renderizado via JS -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
