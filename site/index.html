<!DOCTYPE html>
<html lang="pt-BR" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PNAAT • Operação</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="h-screen overflow-hidden bg-light-bg dark:bg-dark-bg text-brand-black dark:text-brand-white antialiased selection:bg-brand-red selection:text-white transition-theme">

    <div class="flex h-full w-full">

        <!-- SIDEBAR -->
        <aside
            class="app-sidebar relative z-30 flex w-[78px] lg:w-[248px] flex-shrink-0 flex-col bg-brand-black text-white dark:bg-[#0c0f12]">

            <!-- Logo -->
            <div class="flex h-24 items-center justify-center px-4 lg:justify-start lg:px-6">
                <div class="flex items-center">
                    <div
                        class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-red shadow-[0_10px_30px_rgba(214,26,34,.25)]">
                        <i data-lucide="scan-line" class="h-6 w-6"></i>
                    </div>

                    <div class="ml-3 hidden lg:block">
                        <div class="text-xl font-bold tracking-tight">
                            PNAAT
                        </div>

                        <div class="mt-0.5 text-[9px] font-semibold uppercase tracking-[.22em] text-white/35">
                            Sistema de Inspeção
                        </div>
                    </div>
                </div>
            </div>

            <div class="hidden px-6 pb-2 pt-3 text-[10px] font-semibold uppercase tracking-[.2em] text-white/25 lg:block">
                Navegação
            </div>

            <!-- Navegação -->
            <nav id="sidebar-nav" class="custom-scrollbar flex-1 space-y-1 overflow-y-auto px-3 pb-4 lg:px-4">

                <button data-view="operacao" onclick="app.navigate('operacao')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="layout-dashboard"></i>
                    </span>

                    <span class="nav-label">Operação</span>
                </button>

                <button data-view="capturas" onclick="app.navigate('capturas')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="images"></i>
                    </span>

                    <span class="nav-label">Capturas</span>
                </button>

                <button data-view="investigacao" onclick="app.navigate('investigacao')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="scan-search"></i>
                    </span>

                    <span class="nav-label">Investigação</span>
                </button>

                <button data-view="qualidade" onclick="app.navigate('qualidade')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="chart-no-axes-combined"></i>
                    </span>

                    <span class="nav-label">Qualidade</span>
                </button>

                <button data-view="saude" onclick="app.navigate('saude')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="cpu"></i>
                    </span>

                    <span class="nav-label">Saúde da Pi</span>
                </button>

                <button data-view="lote" onclick="app.navigate('lote')" class="nav-item group">
                    <span class="nav-indicator"></span>

                    <span class="nav-icon">
                        <i data-lucide="file-chart-column"></i>
                    </span>

                    <span class="nav-label">Relatório de Lote</span>
                </button>
            </nav>

            <!-- Sidebar footer -->
            <div class="border-t border-white/[.06] p-3 lg:p-4">

                <div class="mb-2 hidden rounded-2xl border border-white/[.05] bg-white/[.035] p-3 lg:flex lg:items-center">
                    <span class="status-dot status-warning mr-3"></span>

                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-orange-300">
                            Demonstração
                        </div>

                        <div class="mt-0.5 text-[11px] text-white/35">
                            <span data-fonte-dados>carregando dados do registro...</span>
                        </div>
                    </div>
                </div>

                <button onclick="app.toggleTheme()" class="sidebar-footer-button">
                    <span class="nav-icon">
                        <i data-lucide="moon" class="hidden dark:block"></i>
                        <i data-lucide="sun" class="block dark:hidden"></i>
                    </span>

                    <span class="nav-label dark:hidden">
                        Modo escuro
                    </span>

                    <span class="nav-label hidden dark:block">
                        Modo claro
                    </span>
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex min-w-0 flex-1 flex-col overflow-hidden">

            <!-- TOPBAR -->
            <header
                class="topbar relative z-20 flex h-[76px] flex-shrink-0 items-center justify-between border-b border-light-border bg-light-surface/90 px-5 backdrop-blur-xl dark:border-dark-border dark:bg-dark-surface/90 sm:px-8">

                <!-- Busca -->
                <div class="relative hidden w-full max-w-md md:flex">
                    <i data-lucide="search"
                        class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"></i>

                    <input id="global-search" type="text" placeholder="Buscar captura, item ou lote..."
                        class="app-input w-full py-2.5 pl-11 pr-12">

                    <span
                        class="absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-md border border-light-border bg-white px-2 py-1 text-[10px] font-semibold text-gray-400 dark:border-dark-border dark:bg-dark-raised lg:block">
                        /
                    </span>
                </div>

                <!-- Mobile logo -->
                <div class="flex items-center md:hidden">
                    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-red">
                        <i data-lucide="scan-line" class="h-5 w-5 text-white"></i>
                    </div>

                    <span class="ml-2 font-bold">
                        PNAAT
                    </span>
                </div>

                <!-- Ações -->
                <div class="flex items-center gap-2 sm:gap-3">

                    <div id="pi-status-container"
                        class="hidden items-center rounded-xl bg-light-bg px-3 py-2 dark:bg-dark-bg lg:flex">
                        <span id="pi-status-dot" class="status-dot status-success mr-2.5"></span>

                        <div class="leading-tight">
                            <div id="pi-status-text" class="text-[11px] font-semibold">
                                Raspberry Pi online
                            </div>

                            <div id="pi-latency-text" class="text-[10px] text-gray-400">
                                Latência 12ms
                            </div>
                        </div>
                    </div>

                    <div id="notifications-wrapper" class="relative">

                        <button id="notifications-button" class="topbar-icon-button" title="Notificações"
                            aria-label="Abrir notificações" aria-expanded="false" type="button">
                            <i data-lucide="bell" class="h-[18px] w-[18px]"></i>

                            <span id="notification-badge" class="
                                    absolute
                                    right-2
                                    top-2

                                    h-2
                                    w-2

                                    rounded-full
                                    bg-brand-red

                                    ring-2
                                    ring-light-surface
                                    dark:ring-dark-surface
                                "></span>
                        </button>

                        <div id="notification-panel" class="
                                absolute
                                right-0
                                top-12

                                z-50

                                hidden

                                w-[340px]
                                max-w-[calc(100vw-2rem)]

                                overflow-hidden

                                rounded-2xl

                                border
                                border-light-border
                                dark:border-dark-border

                                bg-white
                                dark:bg-dark-raised

                                shadow-2xl
                            ">

                            <div class="
                                    flex
                                    items-center
                                    justify-between

                                    border-b
                                    border-light-border
                                    dark:border-dark-border

                                    px-4
                                    py-3
                                ">
                                <div>
                                    <div class="text-sm font-bold">
                                        Notificações
                                    </div>

                                    <div class="mt-0.5 text-[11px] text-gray-400">
                                        Eventos recentes do sistema
                                    </div>
                                </div>

                                <button id="mark-notifications-read" type="button" class="
                                        text-[11px]
                                        font-semibold
                                        text-brand-red

                                        hover:underline
                                    ">
                                    Marcar como lidas
                                </button>
                            </div>

                            <div id="notification-list" class="max-h-[360px] overflow-y-auto p-2">
                            </div>

                        </div>

                    </div>

                    <div
                        class="flex h-10 items-center rounded-xl border border-light-border bg-light-bg px-3 dark:border-dark-border dark:bg-dark-bg sm:px-4">
                        <i data-lucide="package" class="mr-2 h-4 w-4 text-gray-400"></i>

                        <span class="mr-1 hidden text-xs text-gray-500 dark:text-gray-400 sm:inline">
                            Lote
                        </span>

                        <span class="text-xs font-bold text-brand-red"
                              id="lote-atual"
                              title="lote da captura mais recente no registro">
                            &mdash;
                        </span>
                    </div>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="custom-scrollbar flex-1 overflow-y-auto">

                <div class="mx-auto w-full max-w-[1600px] px-5 py-7 sm:px-8 sm:py-8 lg:px-10">

                    <!-- PAGE HEADER -->
                    <section
                        class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">

                        <div>
                            <div class="mb-2 flex items-center">
                                <span
                                    class="text-[10px] font-semibold uppercase tracking-[.18em] text-brand-red sm:text-xs">
                                    Dashboard local
                                </span>

                                <span class="mx-2 text-gray-300 dark:text-gray-700">
                                    /
                                </span>

                                <span class="text-[10px] text-gray-400 sm:text-xs">
                                    Bancada de inspeção
                                </span>
                            </div>

                            <h1 id="page-title"
                                class="text-2xl font-bold tracking-tight sm:text-3xl">
                                Operação
                            </h1>

                            <p id="page-subtitle"
                                class="mt-1.5 text-sm text-gray-500 dark:text-gray-400">
                                Visão geral da bancada em tempo real
                            </p>
                        </div>

                        <div class="demo-badge">
                            <i data-lucide="database" class="mr-2 h-4 w-4"></i>
                            <span data-fonte-dados>carregando dados do registro...</span>
                        </div>
                    </section>

                    <div id="content-area" class="relative min-h-[300px]">
                        <!-- JS -->
                    </div>

                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
