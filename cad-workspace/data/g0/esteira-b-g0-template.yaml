# Pacote de coleta física da Esteira B - template-r01
# Manifest/provenance do pacote: reports/G0-ESTEIRA-B.md (não é provenance física).
# Todos os dados físicos abaixo são null/BLOCKED. IDs e revisão identificam o formulário.
# Quantidades: scalar; vector=[x,y,z]; vectors=[[x,y,z],...].
# Bounds: pares [[xmin,ymin,zmin],[xmax,ymax,zmax],...] no XYZ medido.
# Identifique cada par/posição em method e nas fotos; não use dimensões dentro de texto.
# raw_readings contém uma value completa por repetição, todas na unit declarada.
# Texto: unit=not_applicable; uncertainty.value=not_applicable + basis justificada.
# Unidade global declara convenção; cada quantidade ainda exige sua unidade explícita.
# Fotos e arquivos: duplicar entradas em files, IDs únicos e SHA-256 dos bytes originais.
schema_version: g0-real-collection-v1
g0_id: ESTEIRA-B-G0-TEMPLATE
revision: template-r01
evidence_state: BLOCKED
measured: false
reference_only: false
fabrication_allowed: false
rules:
- Nenhum dado físico foi preenchido. Desconhecido permanece null, nunca zero.
- reference_only e measured são declarações diferentes. REFERENCE não é MEASURED.
- REFERENCE é classe de origem do pacote; não substitui os eixos de evidência, gate
  e decisão do workspace policy.
- Relatórios comerciais, canary e mock-up r03 não entram como medição física.
- Correia nunca é interface estrutural; datums A/B/C são candidatos sem aprovação.
- 'Não declarar measured: true sem instrumento, método, leituras, incerteza e provenance.'
- fabrication_allowed permanece false mesmo após completar e validar a coleta.
- Crie uma nova revisão de coleta; preserve este template e evidências brutas.
